[project]
name = "langchain-langgraph-demo"
version = "0.1.0"
description = "Hands-on LangChain + LangGraph learning repo (Python + OpenRouter)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.3.15",
    "langchain-openai==1.1.10",
    "langchain-text-splitters>=1.0.0",
    "langgraph==1.2.11",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0,<3",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "lessons*"]
